<text x="380" y="260" text-anchor="middle" direction="rtl" font-size="12" fill="#8A5A00">ربط احتياطي</text>
<text x="740" y="318" text-anchor="start" direction="rtl" font-size="12.5" fill="#55606E">المرور الأول: نفس المرجع بعد التطبيع، والتكرار رقم n في ملف يقابل التكرار رقم n في الآخر.</text>
<text x="740" y="338" text-anchor="start" direction="rtl" font-size="12.5" fill="#55606E">التكرار الزائد يُصنَّف «مكررة» وليس «غير موجودة».</text>
<text x="740" y="358" text-anchor="start" direction="rtl" font-size="12.5" fill="#55606E">المرور الثاني (احتياطي): ما بقي بلا زوج ومرجعه غير معروف للطرف الآخر يُربط إذا تساوى المبلغ واليوم والعملة</text>
<text x="740" y="378" text-anchor="start" direction="rtl" font-size="12.5" fill="#55606E">وكان عدد السجلات في المجموعة متساويًا في الملفين، ويُصنَّف «اختلاف في المرجع» للمراجعة.</text>
